name: ci
on: [push, pull_request]
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The Python agent stays shipped for locked-down Windows (Smart App Control blocks an unsigned
  # .exe, the PSF-signed pythonw.exe is allowed) until the Rust agent is code-signed.
  legacy-agent:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q agent/tests

  # The docs follow the code. The same check as tools/githooks/pre-push (which only runs where
  # core.hooksPath is set), on what git has at the checked-out commit, not the ones in between
  # (pull requests are squash-merged): relative links and anchors that resolve to files in git,
  # setup file names, source-available wording (never "open source").
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tools/docs
      # the signed update file's script (needs the openssl of the runner) and the smoke helpers
      - run: python -m pytest -q tools/release tools/smoke
      - run: python tools/docs/check_docs.py

  # Black-box parity: the Rust server must answer every scripted request exactly like the last
  # Python release (extracted from its tag by the harness itself).
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the harness extracts the Python server from a tag
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --release --locked -p printpapi-server
      - run: python tools/parity/parity.py --rust target/release/printpapi

  # Installs the agent for real on a throwaway runner (the runners are fresh VMs with admin rights),
  # through the same subcommands the setup uses, and removes it again. Covers the install plans,
  # the autostart entry and the removal on all three systems, aarch64 included. Never run the script
  # on a machine you care about: it creates a SYSTEM task / systemd unit / launchd daemon.
  setup-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the agent of this build trusts the public half of the committed test seed (Cargo feature
      # update-test-key, never enabled by release.yml), so the smoke test can sign an update
      - run: cargo build --release --locked -p printpapi-server -p printpapi-agent --features printpapi-agent/update-test-key
        env: # no VCRUNTIME140.dll in the Windows programs (see "no C runtime DLL" below)
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      - name: no C runtime DLL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for f in target/release/printpapi-agent.exe target/release/printpapi.exe; do
            if grep -aqi 'vcruntime140' "$f"; then echo "$f needs VCRUNTIME140.dll"; exit 1; fi
          done
      # the same agent as version 99.0.0, and the two examples the update steps use, into target-new
      # (built without --locked: the version lives in Cargo.toml and Cargo.lock; the script puts both back)
      - run: python tools/smoke/build_update_fixture.py
      - name: install, update, print, uninstall
        shell: bash
        run: |
          ext=''
          if [ "$RUNNER_OS" = "Windows" ]; then ext='.exe'; fi
          python tools/smoke/setup_smoke.py \
            --server "target/release/printpapi$ext" \
            --agent "target/release/printpapi-agent$ext" \
            --update-agent "target-new/release/printpapi-agent$ext" \
            --sign-update "target-new/release/examples/sign_update$ext" \
            --fake-tray "target-new/release/examples/fake_tray$ext"

  # The setup window (Tauri) is not a workspace member, so `rust` above never builds it. It embeds
  # the agent binary and the `web/out-setup` pages, so both are built first. Tauri builds against
  # MSVC on Windows; the Linux libraries are the ones from
  # https://v2.tauri.app/start/prerequisites/.
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/setup -> target
      - name: Linux libraries for the window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:setup
        working-directory: web
      - run: cargo build --release --locked -p printpapi-agent
        env: # linked as in release.yml
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      - run: cargo fmt --check
        working-directory: crates/setup
      - run: cargo clippy --locked -- -D warnings
        working-directory: crates/setup
      - run: cargo test --locked
        working-directory: crates/setup
      # The .msi (Windows only, steps in this job so that no new check name appears): build it twice
      # (every build gets a new ProductCode, so the second is a real upgrade of the first) and
      # install, repair, upgrade and remove it for real on this throwaway runner
      # (tools/smoke/setup_smoke.py --msi). Debug builds: the test is about the installer, not the size.
      # tauri-cli at exactly the version crates/setup/wix/managed.wxs was written against.
      - name: tauri-cli for the .msi (Windows)
        if: runner.os == 'Windows'
        run: cargo install tauri-cli --version 2.12.6 --locked
      - name: server for the .msi smoke test (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p printpapi-server
      - name: build the .msi twice (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: crates/setup
        env:
          PRINTPAPI_AGENT_BIN: ${{ github.workspace }}/target/release/printpapi-agent.exe
        run: |
          set -eux
          for n in a b; do
            rm -f target/debug/bundle/msi/*.msi
            cargo tauri build --debug --bundles msi --config tauri.msi.conf.json
            mkdir -p "../../msi-$n"
            cp target/debug/bundle/msi/*.msi "../../msi-$n/"
          done
      - name: smoke test the .msi (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python tools/smoke/setup_smoke.py \
            --server target/release/printpapi.exe \
            --msi "$(ls msi-a/*.msi)" --msi-upgrade "$(ls msi-b/*.msi)"

  # The dashboard bundle in crates/server/web is committed (so a plain `cargo build` checkout has
  # a UI without Node). This job proves the source in web/ still builds, and that nobody changed
  # the source without regenerating the bundle that actually ships.
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history needed to diff the push / PR range
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build:demo
        working-directory: web
      - run: npm run build:setup
        working-directory: web
      - run: npm run check:bundles
        working-directory: web
      - name: bundle must be rebuilt when the UI source changes
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base commit — skipping drift check"; exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          # demo-only and setup-window-only files cannot change the embedded bundle (off.ts and surface.ts can)
          ui=$(echo "$changed" | grep '^web/'             | grep -Ev '^web/demo/(off\.ts|surface\.ts)$' | grep -Ev '^web/demo/'             | grep -Ev '^web/(setup/|app/.*\.setup\.tsx$)' | grep -Ev '^web/(wrangler\.jsonc|scripts/build-demo\.mjs|scripts/build-setup\.mjs|scripts/check-bundles\.mjs)$' || true)
          ui="$ui$(echo "$changed" | grep -E '^web/demo/(off\.ts|surface\.ts)$' || true)"
          if [ -n "$ui" ] && ! echo "$changed" | grep -q '^crates/server/web/'; then
            echo "::error::web/ changed but crates/server/web/ was not regenerated."
            echo "Run: cd web && npm run build:app   — then commit crates/server/web."
            exit 1
          fi
          echo "bundle is in step with the source"
