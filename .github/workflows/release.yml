name: release
# On a version tag: build the agent and the server for every platform and attach them to the
# GitHub release of that tag. A missing release is created as a *draft*, so the notes are still
# written by hand before it goes public; an existing one just gets the assets (re)uploaded.
# The setup downloads (printpapi-setup-*) are listed in web/lib/setup-downloads.json, which also
# feeds the downloads page: a file is uploaded under its listed label, "(Beta)" appended when set.
#
# Signed updates (docs/agent.md, "Updates"): the setup jobs also name the plain program files
# (printpapi-update-agent-*, -tray-*, -appimage-*, -app-*.zip), and the last step of publish builds
# printpapi-update.txt from them and signs it with the key in the GitHub environment release-signing
# (secret UPDATE_SIGNING_KEY). Without the secret, or for a tag that is not vN.N.N, that step ends with a
# notice and the release is published as before. The signed file is uploaded last, after the files it
# names. The job waits for the approval of the environment's required reviewer once that is set.
#
# Beta variants (.msi, .rpm; the ARM64 Windows files come with their own matrix rows): they are built
# AFTER the existing formats have been named and uploaded, with continue-on-error, and travel in a
# second artifact, setup-extra-<name>. A broken beta variant can never take away a shipping installer:
# publish merges all artifacts, and uploads only the files that exist. A file is copied into
# dist-extra only when its check passed (the .msi smoke, the .rpm install check). Their names are
# in web/lib/setup-downloads.json too; tools/docs/test_release_assets.py keeps both lists in step.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, exe: .exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, name: windows-aarch64, exe: .exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64, exe: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64, exe: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-aarch64, exe: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64, exe: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # ring builds C and assembly for this target and wants clang (its BUILDING.md: Windows ARM64
      # needs the "clang" component); the runner image has LLVM, only its folder is not on PATH.
      # https://github.com/briansmith/ring/blob/main/BUILDING.md
      # If the build still fails here, set CC_aarch64_pc_windows_msvc=clang-cl for this row.
      - name: clang for ring (Windows ARM64)
        if: matrix.name == 'windows-aarch64'
        shell: bash
        run: echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --locked --target ${{ matrix.target }} -p printpapi-agent -p printpapi-server
        env: # no VCRUNTIME140.dll in the Windows programs (see "no C runtime DLL" below)
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      # A Windows without the Visual C++ runtime cannot start a program that imports VCRUNTIME140.dll, and
      # a program that SYSTEM starts must not go looking for it in other folders.
      # https://doc.rust-lang.org/reference/linkage.html#static-and-dynamic-c-runtimes
      - name: no C runtime DLL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for f in target/${{ matrix.target }}/release/printpapi-agent.exe target/${{ matrix.target }}/release/printpapi.exe; do
            if grep -aqi 'vcruntime140' "$f"; then echo "$f needs VCRUNTIME140.dll"; exit 1; fi
          done
      - name: package
        shell: bash
        run: |
          set -eux
          rel=target/${{ matrix.target }}/release
          for pkg in agent server; do
            d=dist/printpapi-$pkg-${{ matrix.name }}
            mkdir -p "$d"
            cp LICENSE "$d/"
          done
          cp "$rel/printpapi-agent${{ matrix.exe }}" agent/agent.ini.example dist/printpapi-agent-${{ matrix.name }}/
          cp "$rel/printpapi${{ matrix.exe }}" dist/printpapi-server-${{ matrix.name }}/
          cd dist
          for d in printpapi-agent-${{ matrix.name }} printpapi-server-${{ matrix.name }}; do
            if [ "${{ runner.os }}" = "Windows" ]; then 7z a -tzip "$d.zip" "$d" >/dev/null
            else tar -czf "$d.tar.gz" "$d"; fi
            rm -rf "$d"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  # The setup window (crates/setup, not a workspace member) embeds the agent binary of the same
  # target, so the agent is built first. Windows ships the bare exe (no installer in front of the
  # setup); the others ship Tauri bundles. Bundle names are not matched exactly: each format has
  # one file in its folder, renamed to the scheme of web/lib/setup-downloads.json.
  # Linux libraries: https://v2.tauri.app/start/prerequisites/ ; AppImage extras (patchelf,
  # xdg-utils) as in https://v2.tauri.app/distribute/pipelines/github/.
  # Linux builds run on the oldest system the downloads should start on, pinned (not
  # ubuntu-latest, which moves): the bundled libraries ask for the glibc of the build system, and
  # an AppImage built on 24.04 does not start on Ubuntu 22.04 or Debian 12 (GLIBC_2.38 not found).
  # https://v2.tauri.app/distribute/appimage/ names Ubuntu 22.04 and Debian 12 as baselines.
  setup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, exe: .exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, name: windows-aarch64, exe: .exe }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64, exe: "" }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64, exe: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-aarch64, exe: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64, exe: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
            crates/setup -> target
      - name: Linux libraries for the window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:setup
        working-directory: web
      # ring builds C and assembly for this target and wants clang (its BUILDING.md: Windows ARM64
      # needs the "clang" component); the runner image has LLVM, only its folder is not on PATH.
      # https://github.com/briansmith/ring/blob/main/BUILDING.md
      # If the build still fails here, set CC_aarch64_pc_windows_msvc=clang-cl for this row.
      - name: clang for ring (Windows ARM64)
        if: matrix.name == 'windows-aarch64'
        shell: bash
        run: echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --locked --target ${{ matrix.target }} -p printpapi-agent
        env: # the agent inside the setup, linked as in the build job
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      - name: no C runtime DLL in the embedded agent (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          f=target/${{ matrix.target }}/release/printpapi-agent.exe
          if grep -aqi 'vcruntime140' "$f"; then echo "$f needs VCRUNTIME140.dll"; exit 1; fi
      # Exactly this version: crates/setup/wix/managed.wxs uses ids of the .msi template of this tauri-cli.
      - run: cargo install tauri-cli --version 2.12.6 --locked
      - name: build the setup (Windows exe)
        if: runner.os == 'Windows'
        working-directory: crates/setup
        env:
          PRINTPAPI_AGENT_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/printpapi-agent${{ matrix.exe }}
        run: cargo tauri build --no-bundle --target ${{ matrix.target }}
      - name: build the setup (.deb)
        if: runner.os == 'Linux'
        working-directory: crates/setup
        env:
          PRINTPAPI_AGENT_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/printpapi-agent
        run: cargo tauri build --target ${{ matrix.target }} --bundles deb
      # linuxdeploy cannot cross-compile, and WebKitGTK in an aarch64 AppImage is not proven. If it
      # fails there, only that file is missing: the .deb and the release stay.
      - name: build the setup (AppImage)
        if: runner.os == 'Linux'
        continue-on-error: ${{ matrix.name == 'linux-aarch64' }}
        working-directory: crates/setup
        env:
          PRINTPAPI_AGENT_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/printpapi-agent
        run: cargo tauri build --target ${{ matrix.target }} --bundles appimage
      - name: build the setup (.dmg)
        if: runner.os == 'macOS'
        working-directory: crates/setup
        env:
          PRINTPAPI_AGENT_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/printpapi-agent
        # app and dmg: with dmg alone Tauri removes the .app, and the update needs it as a ZIP
        run: cargo tauri build --target ${{ matrix.target }} --bundles app,dmg
      - name: name the files
        shell: bash
        run: |
          set -eux
          rel=crates/setup/target/${{ matrix.target }}/release
          agent=target/${{ matrix.target }}/release/printpapi-agent${{ matrix.exe }}
          mkdir dist
          # The plain program files an update swaps in (printpapi-update-*): the agent of this job
          # and the program that is the tray icon and the window. Their names are the roles of
          # tools/release/update_manifest.py.
          cp "$agent" "dist/printpapi-update-agent-${{ matrix.name }}${{ matrix.exe }}"
          case "$RUNNER_OS" in
            Windows)
              cp "$rel/printpapi-setup.exe" dist/printpapi-setup-${{ matrix.name }}.exe
              cp "$rel/printpapi-setup.exe" dist/printpapi-update-tray-${{ matrix.name }}.exe ;;
            macOS)
              cp "$rel"/bundle/dmg/*.dmg dist/printpapi-setup-${{ matrix.name }}.dmg
              # one .app, zipped with its folder as ditto -x -k unpacks it
              ditto -c -k --keepParent "$rel"/bundle/macos/*.app dist/printpapi-update-app-${{ matrix.name }}.zip ;;
            Linux)
              cp "$rel"/bundle/deb/*.deb dist/printpapi-setup-${{ matrix.name }}.deb
              # the program inside the .deb is the tray icon and the window
              mkdir deb-root
              dpkg-deb -x "$rel"/bundle/deb/*.deb deb-root
              cp deb-root/usr/bin/printpapi-setup dist/printpapi-update-tray-${{ matrix.name }}
              # a failed (allowed) aarch64 AppImage leaves no file; publish skips what is missing
              if ls "$rel"/bundle/appimage/*.AppImage >/dev/null 2>&1; then
                cp "$rel"/bundle/appimage/*.AppImage dist/printpapi-setup-${{ matrix.name }}.AppImage
                cp "$rel"/bundle/appimage/*.AppImage dist/printpapi-update-appimage-${{ matrix.name }}
              fi ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      # ---- beta variants: everything below may fail without taking anything away ----
      # Windows: the .msi. Built twice, because Product Id="*" gives every build a new ProductCode,
      # so the second one is a real major upgrade of the first for the smoke test (the template's
      # MajorUpgrade allows the same version). The smoke test installs, upgrades and removes for real:
      # throwaway runners only. Only a smoke-proven .msi (the second build) goes into dist-extra.
      - name: build the server (the .msi smoke test needs it)
        id: server
        if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo build --release --locked --target ${{ matrix.target }} -p printpapi-server
      - name: build the .msi (first)
        id: msi_a
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        working-directory: crates/setup
        env:
          PRINTPAPI_AGENT_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/printpapi-agent${{ matrix.exe }}
        run: |
          set -eux
          cargo tauri build --target ${{ matrix.target }} --bundles msi --config tauri.msi.conf.json
          mkdir -p ../../msi-a
          cp target/${{ matrix.target }}/release/bundle/msi/*.msi ../../msi-a/
      - name: build the .msi (second, for the upgrade)
        id: msi_b
        if: steps.msi_a.outcome == 'success'
        continue-on-error: true
        shell: bash
        working-directory: crates/setup
        env:
          PRINTPAPI_AGENT_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/printpapi-agent${{ matrix.exe }}
        run: |
          set -eux
          rm -f target/${{ matrix.target }}/release/bundle/msi/*.msi
          cargo tauri build --target ${{ matrix.target }} --bundles msi --config tauri.msi.conf.json
          mkdir -p ../../msi-b
          cp target/${{ matrix.target }}/release/bundle/msi/*.msi ../../msi-b/
      - name: smoke test the .msi
        id: msi_smoke
        if: steps.msi_b.outcome == 'success' && steps.server.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -eux
          python tools/smoke/setup_smoke.py \
            --server "target/${{ matrix.target }}/release/printpapi.exe" \
            --msi "$(ls msi-a/*.msi)" --msi-upgrade "$(ls msi-b/*.msi)"
      - name: name the .msi
        if: steps.msi_smoke.outcome == 'success'
        shell: bash
        run: |
          mkdir -p dist-extra
          cp msi-b/*.msi dist-extra/printpapi-setup-${{ matrix.name }}.msi
      - name: say what is missing (.msi)
        if: runner.os == 'Windows' && steps.msi_smoke.outcome != 'success'
        shell: bash
        run: echo "::warning::No .msi for ${{ matrix.name }}. server=${{ steps.server.outcome }}, first build=${{ steps.msi_a.outcome }}, second build=${{ steps.msi_b.outcome }}, smoke test=${{ steps.msi_smoke.outcome }}."
      # Linux: the .rpm, then an install check in Fedora (this and the previous release) and openSUSE
      # Tumbleweed (tools/packaging/rpm_install_check.sh). Only a checked .rpm goes into dist-extra.
      - name: build the .rpm
        id: rpm
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: crates/setup
        env:
          PRINTPAPI_AGENT_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/printpapi-agent
        run: cargo tauri build --target ${{ matrix.target }} --bundles rpm
      - name: check the .rpm installs
        id: rpm_check
        if: steps.rpm.outcome == 'success'
        continue-on-error: true
        run: bash tools/packaging/rpm_install_check.sh crates/setup/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
      - name: name the .rpm
        if: steps.rpm_check.outcome == 'success'
        run: |
          mkdir -p dist-extra
          cp crates/setup/target/${{ matrix.target }}/release/bundle/rpm/*.rpm dist-extra/printpapi-setup-${{ matrix.name }}.rpm
      - name: say what is missing (.rpm)
        if: runner.os == 'Linux' && steps.rpm_check.outcome != 'success'
        run: echo "::warning::No .rpm for ${{ matrix.name }}. build=${{ steps.rpm.outcome }}, install check=${{ steps.rpm_check.outcome }}."
      - uses: actions/upload-artifact@v4
        with:
          name: setup-extra-${{ matrix.name }}
          path: dist-extra/*
          if-no-files-found: ignore

  publish:
    needs: [build, setup]
    # Publish whatever built: one broken platform must not hold back the others' archives.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # The environment that holds the signing key (secret UPDATE_SIGNING_KEY): its secrets reach this
    # job only after its rules (required reviewer, tags v*) are met. An environment that does not
    # exist is created by GitHub without rules and without secrets, so releases work before it is set up.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The legacy Python agent, for Windows machines that block the unsigned Rust exe.
      - name: package the Python agent
        run: |
          mkdir -p py/printpapi-agent-python
          cp agent/print_agent.py agent/agent.ini.example LICENSE py/printpapi-agent-python/
          (cd py && zip -qr ../dist/printpapi-agent-python.zip printpapi-agent-python)
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release notes are the annotated tag's message: subject = title, body = notes.
          # (checkout leaves a shallow, lightweight copy of the tag; fetch the real tag object.)
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents:subject)' "$TAG" > title.txt
          git tag -l --format='%(contents:body)' "$TAG" > notes.md
          [ -s title.txt ] || echo "$TAG" > title.txt
          [ -s notes.md ] || echo "Binaries for $TAG." > notes.md
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
                 --title "$(cat title.txt)" --notes-file notes.md
          gh release upload "$TAG" dist/printpapi-agent-* dist/printpapi-server-* \
            -R "$GITHUB_REPOSITORY" --clobber
          # The setup downloads, one display label each ("file#label"). The file name stays the
          # same when "(Beta)" later falls away, so the download links stay stable. Files that did
          # not build are skipped, like the archives above.
          while IFS=$'\t' read -r asset label beta; do
            if [ ! -f "dist/$asset" ]; then echo "skipping $asset (not built)"; continue; fi
            if [ "$beta" = true ]; then label="$label (Beta)"; fi
            gh release upload "$TAG" "dist/$asset#$label" -R "$GITHUB_REPOSITORY" --clobber
          done < <(jq -r '.[] | [.asset, .label, .beta] | @tsv' web/lib/setup-downloads.json)
      # The signed update file, last: it names the files above, so a client never sees a signed file
      # whose files are not there yet. The key is in the environment of this step only.
      - name: sign and publish the update files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if ! version=$(python3 tools/release/update_manifest.py tag "$TAG"); then
            echo "::notice::$TAG is not a vN.N.N release tag, so no update is published."
            exit 0
          fi
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::notice::No UPDATE_SIGNING_KEY in the release-signing environment, so no update is published (see SECURITY.md)."
            exit 0
          fi
          python3 tools/release/update_manifest.py build --version "$version" --dist dist --out update-payload.json
          python3 tools/release/update_manifest.py sign --payload update-payload.json --out dist/printpapi-update.txt
          files=$(ls dist/printpapi-update-* | grep -v '^dist/printpapi-update\.txt$')
          gh release upload "$TAG" $files -R "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" dist/printpapi-update.txt -R "$GITHUB_REPOSITORY" --clobber
