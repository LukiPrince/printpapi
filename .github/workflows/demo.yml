name: demo
# Deploys the static demo (web/out-demo) to the Cloudflare Worker "printpapi-demo" (static assets).
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:
permissions:
  contents: read
# deploys stay ordered: a newer run waits for the running one instead of cancelling it
concurrency:
  group: demo-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run build:demo
        working-directory: web
      # check:bundles also guards the setup window's build against the other two, so it needs it
      - run: npm run build:setup
        working-directory: web
      - run: npm run check:bundles
        working-directory: web
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          workingDirectory: web
          command: deploy
