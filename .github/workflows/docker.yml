name: docker
# Builds the server image and pushes it to GHCR so users can pull a prebuilt
# image instead of `docker build`. Fires on version tags only — a `release:
# published` trigger would run the identical build a second time, since the tag
# is always pushed first and the release page is cut from it afterwards.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io under this repo's namespace
    steps:
      - uses: actions/checkout@v4
      # qemu + buildx: needed to cross-build the arm64 image on an amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}   # metadata-action lowercases it for GHCR
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Final releases only. metadata-action already skips {{major}}.{{minor}} and its own
            # latest flavor for a prerelease tag (v2.5.0-rc.1), but a raw tag bypasses that rule —
            # and an -rc image must never be what a plain `docker pull` hands out.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # ponytail: arm64 too — self-hosters run the server on Raspberry Pi / ARM VPS.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
