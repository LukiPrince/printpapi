[package]
name = "printpapi-server"
description = "printpapi print server: HTTP API, job queue, dashboard"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "printpapi"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "png", "jpeg"] }
include_dir = "0.7.4"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls", "ring", "rustls-platform-verifier"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust_decimal = "1.43.0"
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
printpapi-agent = { path = "../agent" }
tempfile = "3.27.0"
