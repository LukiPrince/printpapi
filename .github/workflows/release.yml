name: release
# On a version tag: build the agent and the server for every platform and attach them to the
# GitHub release of that tag. A missing release is created as a *draft*, so the notes are still
# written by hand before it goes public; an existing one just gets the assets (re)uploaded.
# The setup downloads (printpapi-setup-*) are listed in web/lib/setup-downloads.json, which also
# feeds the downloads page: a file is uploaded under its listed label, "(Beta)" appended when set.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, exe: .exe }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64, exe: "" }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64, exe: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-aarch64, exe: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64, exe: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p printpapi-agent -p printpapi-server
      - name: package
        shell: bash
        run: |
          set -eux
          rel=target/${{ matrix.target }}/release
          for pkg in agent server; do
            d=dist/printpapi-$pkg-${{ matrix.name }}
            mkdir -p "$d"
            cp LICENSE "$d/"
          done
          cp "$rel/printpapi-agent${{ matrix.exe }}" agent/agent.ini.example dist/printpapi-agent-${{ matrix.name }}/
          cp "$rel/printpapi${{ matrix.exe }}" dist/printpapi-server-${{ matrix.name }}/
          cd dist
          for d in printpapi-agent-${{ matrix.name }} printpapi-server-${{ matrix.name }}; do
            if [ "${{ runner.os }}" = "Windows" ]; then 7z a -tzip "$d.zip" "$d" >/dev/null
            else tar -czf "$d.tar.gz" "$d"; fi
            rm -rf "$d"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  # The setup window (crates/setup, not a workspace member) embeds the agent binary of the same
  # target, so the agent is built first. Windows ships the bare exe (no installer in front of the
  # setup); the others ship Tauri bundles. Bundle names are not matched exactly: each format has
  # one file in its folder, renamed to the scheme of web/lib/setup-downloads.json.
  # Linux libraries: https://v2.tauri.app/start/prerequisites/ ; AppImage extras (patchelf,
  # xdg-utils) as in https://v2.tauri.app/distribute/pipelines/github/.
  # Linux builds run on the oldest system the downloads should start on, pinned (not
  # ubuntu-latest, which moves): the bundled libraries ask for the glibc of the build system, and
  # an AppImage built on 24.04 does not start on Ubuntu 22.04 or Debian 12 (GLIBC_2.38 not found).
  # https://v2.tauri.app/distribute/appimage/ names Ubuntu 22.04 and Debian 12 as baselines.
  setup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, exe: .exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64, exe: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64, exe: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-aarch64, exe: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64, exe: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
            crates/setup -> target
      - name: Linux libraries for the window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:setup
        working-directory: web
      - run: cargo build --release --locked --target ${{ matrix.target }} -p printpapi-agent
      - run: cargo install tauri-cli --version "^2" --locked
      - name: build the setup (Windows exe)
        if: runner.os == 'Windows'
        working-directory: crates/setup
        env:
          PRINTPAPI_AGENT_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/printpapi-agent${{ matrix.exe }}
        run: cargo tauri build --no-bundle --target ${{ matrix.target }}
      - name: build the setup (.deb)
        if: runner.os == 'Linux'
        working-directory: crates/setup
        env:
          PRINTPAPI_AGENT_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/printpapi-agent
        run: cargo tauri build --target ${{ matrix.target }} --bundles deb
      # linuxdeploy cannot cross-compile, and WebKitGTK in an aarch64 AppImage is not proven. If it
      # fails there, only that file is missing: the .deb and the release stay.
      - name: build the setup (AppImage)
        if: runner.os == 'Linux'
        continue-on-error: ${{ matrix.name == 'linux-aarch64' }}
        working-directory: crates/setup
        env:
          PRINTPAPI_AGENT_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/printpapi-agent
        run: cargo tauri build --target ${{ matrix.target }} --bundles appimage
      - name: build the setup (.dmg)
        if: runner.os == 'macOS'
        working-directory: crates/setup
        env:
          PRINTPAPI_AGENT_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/printpapi-agent
        run: cargo tauri build --target ${{ matrix.target }} --bundles dmg
      - name: name the files
        shell: bash
        run: |
          set -eux
          rel=crates/setup/target/${{ matrix.target }}/release
          mkdir dist
          case "$RUNNER_OS" in
            Windows) cp "$rel/printpapi-setup.exe" dist/printpapi-setup-${{ matrix.name }}.exe ;;
            macOS) cp "$rel"/bundle/dmg/*.dmg dist/printpapi-setup-${{ matrix.name }}.dmg ;;
            Linux)
              cp "$rel"/bundle/deb/*.deb dist/printpapi-setup-${{ matrix.name }}.deb
              # a failed (allowed) aarch64 AppImage leaves no file; publish skips what is missing
              if ls "$rel"/bundle/appimage/*.AppImage >/dev/null 2>&1; then
                cp "$rel"/bundle/appimage/*.AppImage dist/printpapi-setup-${{ matrix.name }}.AppImage
              fi ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build, setup]
    # Publish whatever built: one broken platform must not hold back the others' archives.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The legacy Python agent, for Windows machines that block the unsigned Rust exe.
      - name: package the Python agent
        run: |
          mkdir -p py/printpapi-agent-python
          cp agent/print_agent.py agent/agent.ini.example LICENSE py/printpapi-agent-python/
          (cd py && zip -qr ../dist/printpapi-agent-python.zip printpapi-agent-python)
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release notes are the annotated tag's message: subject = title, body = notes.
          # (checkout leaves a shallow, lightweight copy of the tag; fetch the real tag object.)
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents:subject)' "$TAG" > title.txt
          git tag -l --format='%(contents:body)' "$TAG" > notes.md
          [ -s title.txt ] || echo "$TAG" > title.txt
          [ -s notes.md ] || echo "Binaries for $TAG." > notes.md
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
                 --title "$(cat title.txt)" --notes-file notes.md
          gh release upload "$TAG" dist/printpapi-agent-* dist/printpapi-server-* \
            -R "$GITHUB_REPOSITORY" --clobber
          # The setup downloads, one display label each ("file#label"). The file name stays the
          # same when "(Beta)" later falls away, so the download links stay stable. Files that did
          # not build are skipped, like the archives above.
          while IFS=$'\t' read -r asset label beta; do
            if [ ! -f "dist/$asset" ]; then echo "skipping $asset (not built)"; continue; fi
            if [ "$beta" = true ]; then label="$label (Beta)"; fi
            gh release upload "$TAG" "dist/$asset#$label" -R "$GITHUB_REPOSITORY" --clobber
          done < <(jq -r '.[] | [.asset, .label, .beta] | @tsv' web/lib/setup-downloads.json)
